# honeypot-sql - Helm values

replicaCount: 1

image:
  repository: git.ebaillon.fr/infra/honeypot-sql
  tag: "0.1.6"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: gitea-registry-credentials

nameOverride: ""
fullnameOverride: "honeypot-sql"

serviceAccount:
  create: true
  name: "honeypot-sql"

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Dashboard (ClusterIP, behind Traefik) and the two honeypot listeners
# (NodePort on the node's LAN IP; the apiserver uses the default
# 30000-32767 range, so 35432 is not available).
service:
  http:
    port: 8080
  honeypot:
    type: NodePort
    mysqlPort: 3306
    mysqlNodePort: 30306
    pgPort: 5432
    pgNodePort: 30432

ingress:
  enabled: true
  host: honeypot.ebaillon.fr
  tls: true
  certResolver: letsencrypt
  # Shared middlewares from orgs/infra/traefik (cross-namespace).
  hardening:
    enabled: true

resources:
  limits:
    cpu: 400m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 192Mi

nodeSelector: {}
tolerations: []
affinity: {}

env:
  HONEYPOT_MYSQL_ADDR: ":3306"
  HONEYPOT_PG_ADDR: ":5432"
  HONEYPOT_HTTP_ADDR: ":8080"
  HONEYPOT_MYSQL_VERSION: "8.0.36"
  HONEYPOT_PG_VERSION: "16.3"
  # cleartext records the password as typed; md5 only records a hash.
  HONEYPOT_PG_AUTH: cleartext
  HONEYPOT_MAX_CONNS: "500"
  # Tarpit: delay before each reply to keep attackers engaged (0 = off).
  # Non-zero makes each session hold its connection slot longer, so it trades
  # capacity (HONEYPOT_MAX_CONNS) for stickiness. Capped by the session max.
  HONEYPOT_TARPIT: "0"
  # Offline country/ASN attribution. The image bakes in the public-domain
  # ip2asn table (iptoasn.com) at /ip2asn.tsv.gz, fetched at build time; the
  # honeypot only reads the local file, never the network. Set empty to turn
  # attribution off. See the README "Attribution" section.
  HONEYPOT_IP2ASN: "/ip2asn.tsv.gz"
  # Canary tokens (HONEYPOT_CANARY / HONEYPOT_BEACON_*) are driven by the
  # `canary` and `beacon` blocks below, not set here.

# Canary tokens planted in the fake data to trace where "stolen" data goes.
# Credential replay (a planted login seen again on our listeners) needs only
# this; the HTTP beacon below additionally catches a planted URL being loaded.
canary:
  enabled: false

# The beacon is the "black box": an unauthenticated HTTP listener that only
# receives pings. Reaching it means a public, unauthenticated endpoint, so it
# ships OFF and nothing is exposed until you turn it on and pick a host. When
# enabled it also forces canary planting on.
beacon:
  enabled: false
  port: 8081
  # Hostname woven into the planted URLs (https://<host>/t/<token>). It must
  # resolve to where the beacon is reachable. For the data to be traced when it
  # leaves the LAN, this host has to be public (e.g. via the Cloudflare tunnel),
  # which is the deliberate exposure step. Empty = plant no URL tokens.
  host: ""
  ingress:
    # Route <host> to the beacon through Traefik (websecure). Keep off to wire
    # exposure yourself (tunnel, another proxy, a NodePort...).
    enabled: false
    tls: true
    certResolver: letsencrypt

# Vault entry (via ESO): DATABASE_URL, ADMIN_USER, ADMIN_PASSWORD, optional HONEYPOT_PASSWORDS.
vault:
  secretPath: secret/data/honeypot-sql/main

livenessProbe:
  httpGet:
    path: /api/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5

startupProbe:
  httpGet:
    path: /api/live
    port: http
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 5

strategy:
  type: Recreate

networkPolicy:
  enabled: true
