apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "honeypot-sql.fullname" . }}-secrets
  labels:
    {{- include "honeypot-sql.labels" . | nindent 4 }}
  annotations:
    # Plain resource (not a hook), wave -3 so the Secret exists before the Deployment.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ include "honeypot-sql.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  # Keys: DATABASE_URL, ADMIN_USER, ADMIN_PASSWORD. Optional: HONEYPOT_PASSWORDS (honeytokens).
  dataFrom:
    - extract:
        key: {{ .Values.vault.secretPath }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
