{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "honeypot-sql.fullname" . }}
  labels:
    {{- include "honeypot-sql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "honeypot-sql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Dashboard: Traefik and Prometheus only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # Honeypot ports: anyone (that is the purpose).
    - ports:
        - protocol: TCP
          port: {{ .Values.service.honeypot.mysqlPort }}
        - protocol: TCP
          port: {{ .Values.service.honeypot.pgPort }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # State in the shared CNPG cluster. Nothing else: the honeypot never
    # calls back to anyone (no CrowdSec API, no Internet). IP attribution is a
    # local file (ip2asn), not a network call.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
