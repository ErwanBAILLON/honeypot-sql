apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "honeypot-sql.fullname" . }}
  labels:
    {{- include "honeypot-sql.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "honeypot-sql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "honeypot-sql.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "honeypot-sql.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 15
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: mysql
              containerPort: {{ .Values.service.honeypot.mysqlPort }}
              protocol: TCP
            - name: postgres
              containerPort: {{ .Values.service.honeypot.pgPort }}
              protocol: TCP
            {{- if .Values.beacon.enabled }}
            - name: beacon
              containerPort: {{ .Values.beacon.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if or .Values.canary.enabled .Values.beacon.enabled }}
            - name: HONEYPOT_CANARY
              value: "1"
            {{- end }}
            {{- if .Values.beacon.enabled }}
            - name: HONEYPOT_BEACON_ADDR
              value: ":{{ .Values.beacon.port }}"
            {{- if .Values.beacon.host }}
            - name: HONEYPOT_BEACON_URL
              value: "https://{{ .Values.beacon.host }}/t"
            {{- end }}
            {{- end }}
          # DATABASE_URL, ADMIN_USER, ADMIN_PASSWORD (+ optional HONEYPOT_PASSWORDS) from Vault.
          envFrom:
            - secretRef:
                name: {{ include "honeypot-sql.fullname" . }}-secrets
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
